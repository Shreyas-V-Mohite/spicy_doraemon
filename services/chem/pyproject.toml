[project]
name = "chem"
version = "0.1.0"
description = "Chemistry service: PubChem lookup and RDKit functional-group atom indices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pubchempy>=1.0.4",
    "rdkit>=2024.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
